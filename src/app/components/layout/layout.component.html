<div class="app-shell">
  <mat-drawer-container class="drawer-container" autosize>
    <mat-drawer #drawer class="sidenav" mode="side" opened>
      <div class="brand">
        <span class="brand-mark">SE</span>
        <span>Smart Expense</span>
      </div>

      <mat-nav-list>
        @for (menu of menuItems; track menu.name) {
          <a
            mat-list-item
            [routerLink]="menu.link"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: menu.link === '' }"
          >
            <mat-icon matListItemIcon>{{menu.name === 'Dashboard' ? 'dashboard' : menu.name === 'Expenses' ? 'receipt_long' : menu.name === 'Budgets' ? 'account_balance_wallet' : 'category'}}</mat-icon>
            <span matListItemTitle>{{menu.name}}</span>
          </a>
        }
      </mat-nav-list>
    </mat-drawer>

    <mat-drawer-content>
      <header class="topbar">
        <button mat-icon-button type="button" (click)="drawer.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
        <div>
          <p>Workspace</p>
          <h1>Smart Expense</h1>
        </div>
      </header>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
