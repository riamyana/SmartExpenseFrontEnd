<h2 mat-dialog-title class="dialog-title">Add Expenses</h2>

<mat-dialog-content class="upload-dialog-content">
  <div class="entry-toolbar">
    <div class="upload-actions">
      <label class="file-picker" [class.has-file]="selectedFile">
        <input type="file" (change)="onFileSelected($event)" />
        <span>{{ filename || 'Choose statement' }}</span>
      </label>
      <button mat-raised-button class="action-button upload-button" (click)="upload()">Upload Statement</button>
    </div>

    <div class="manual-entry-actions">
      <mat-form-field appearance="outline">
        <mat-label>Number of expenses</mat-label>
        <input matInput type="number" min="1" [(ngModel)]="manualExpenseCount">
      </mat-form-field>
      <button mat-raised-button class="action-button add-button" (click)="addManualDraftRows()">Add rows</button>
    </div>
  </div>

  <div class="draft-table-container" *ngIf="draftTransactions.length > 0">
    <table mat-table [dataSource]="draftTransactions" class="mat-elevation-z4">
      <ng-container matColumnDef="srNo">
        <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
        <td mat-cell *matCellDef="let row; let i = index"> {{ i + 1 }} </td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let element">
          <input class="table-input date-input" type="date" [(ngModel)]="element.date" [disabled]="isUploadedDraft(element)">
        </td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let element">
          <input class="table-input description-input" type="text" [(ngModel)]="element.description">
        </td>
      </ng-container>
      <ng-container matColumnDef="withdrawal">
        <th mat-header-cell *matHeaderCellDef class="amount-header"> Withdrawal (&#8377;) </th>
        <td mat-cell *matCellDef="let element" class="amount-cell">
          <input class="table-input amount-input withdrawal-amount" type="number" min="0" step="0.01" [(ngModel)]="element.withdrawal" [disabled]="isUploadedDraft(element)">
        </td>
      </ng-container>
      <ng-container matColumnDef="deposit">
        <th mat-header-cell *matHeaderCellDef class="amount-header"> Deposit (&#8377;) </th>
        <td mat-cell *matCellDef="let element" class="amount-cell">
          <input class="table-input amount-input deposit-amount" type="number" min="0" step="0.01" [(ngModel)]="element.deposit" [disabled]="isUploadedDraft(element)">
        </td>
      </ng-container>
      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef> Delete </th>
        <td mat-cell *matCellDef="let element; let i = index">
          <button mat-button class="delete-button" (click)="deleteDraftRow(i)">Delete</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="draftDisplayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: draftDisplayedColumns;"></tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
  <button mat-raised-button class="save-button" (click)="saveExpenses()" [disabled]="!canSaveDrafts">Save</button>
</mat-dialog-actions>
